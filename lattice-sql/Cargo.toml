[package]
name = "lattice-sql"
version = "1.10.1"
edition = "2021"
description = "SQL frontend for lattice-db — parses SQL, plans queries, executes against storage-service over NATS"
license = "Apache-2.0"
autobins = false

[lib]
name = "lattice_sql"
path = "src/main.rs"
crate-type = ["cdylib"]

[dependencies]
lattice-db-client = { path = "../lattice-db-client" }
nats-wasi = { package = "nats-wasip3", version = "0.11.3", git = "https://github.com/Taika-3D-Oy/nats-wasip3.git" }
wasip3 = { version = "0.7", features = ["async-spawn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.55", default-features = false }
